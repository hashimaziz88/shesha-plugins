name: registry

# Regenerates the component registry from the PINNED shesha-framework ref recorded
# in the registry's own _meta.json, and fails if the result differs from what is
# committed. That is what makes the registry reproducible rather than a snapshot
# somebody once generated on their own machine (D-004).
#
# The extractor itself lands in WP-2. Until then this workflow verifies the two
# properties that are already checkable: the provenance file exists and carries a
# pinned ref, and no committed registry data contains a machine-local path.

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a framework change surfaces as a diff rather than as a surprise.
    - cron: '0 6 * * 1'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Registry provenance is pinned and machine-independent
        run: npm run gates
