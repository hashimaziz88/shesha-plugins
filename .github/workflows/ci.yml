name: ci

# `npm run green` is the definition of a pushable tree: typecheck, tests, every
# gate, and the mutation suite that proves each gate can fail. Nothing here is
# allowed to continue-on-error — a green badge over a skipped step is the exact
# signal this repository was rebuilt to stop producing.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: green (typecheck, tests, gates, mutations)
        run: npm run green

      - name: Prove the single compiler entrypoint starts
        run: npm run sfs -- --version

      - name: Report scope completion
        # Exits 3 while the scope is incomplete, which is not a failure of CI.
        run: npm run prove -- --partial || test $? -eq 3
